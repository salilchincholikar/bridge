name: Checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Explicit toolchain; update deliberately against actions/runner-images inventory.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Source assets and shell syntax
        run: make lint
      - name: Offline regressions
        run: make test
      - name: Independent Core consumer
        run: make example
      - name: Production bundle
        run: make app verify-bundle
      - name: Compile dedicated offline UI harness
        run: make ui-test-app
      # GUI execution is a separate interactive acceptance gate until hosted-runner support is verified.
      # No AWS/provider credentials, publishing tokens, signing certificates or release jobs are used here.
