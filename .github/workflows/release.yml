name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          version = plistlib.loads(Path('Resources/Info.plist').read_bytes())['CFBundleShortVersionString']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert Path('docs/release-notes/' + os.environ['GITHUB_REF_NAME'] + '.md').is_file()
          PY
      - name: Offline checks and production bundle
        run: make check
      - name: Package and verify extracted preview
        run: python3 scripts/package-preview.py
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "Bridge $GITHUB_REF_NAME — Developer Preview" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md" build/release/*.zip build/release/SHA256SUMS.txt build/release/manifest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
